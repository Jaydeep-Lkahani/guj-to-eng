<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="description" content="ગુજરાતીમાં સમજાવેલું, સરળ અંગ્રેજી શીખો." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>ચાલો અંગ્રેજી શીખીએ</title>
    <script>
      // Set light/dark before the page draws (same key as src/theme.ts).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("guj-eng.theme.v1");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
