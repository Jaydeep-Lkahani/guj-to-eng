<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>Gujarati to English – Learn English in Gujarati | ગુજરાતીમાં અંગ્રેજી શીખો</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="Gujarati to English" />
    <meta name="apple-mobile-web-app-title" content="અંગ્રેજી શીખો" />
    <meta name="author" content="ચાલો અંગ્રેજી શીખીએ" />
    <script>
      // Set light/dark before the page draws (same key as src/theme.ts).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("guj-eng.theme.v1");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <!--seo-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
